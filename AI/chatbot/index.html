<!doctype html>
<html>
<head>
    <title>ShopEasy Chatbot</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f0f0f0;
        }
        h2 {
            text-align: center;
            padding: 10px;
            background: #0078d7;
            color: white;
            margin: 0;
        }
        #chatBox {
            width: 400px;
            height: 350px;
            border: 1px solid #ccc;
            background: white;
            overflow-y: auto;
            padding: 10px;
            margin: 20px auto;
        }
        .user {
            text-align: right;
            color: blue;
            margin: 5px 0;
        }
        .bot {
            text-align: left;
            color: green;
            margin: 5px 0;
        }
        #inputArea {
            text-align: center;
        }
        #userInput {
            width: 350px;
            padding: 6px;
        }
        button {
            padding: 6px 14px;
            background: #0078d7;
            color: white;
            border: none;
            cursor: pointer;
        }
    </style>
</head>

<body>
    <h2>ShopEasy Customer Support</h2>
    <div id="chatBox">
        <p class="bot">Bot: Hello! How can I help you today?</p>
    </div>
    <div id="inputArea">
        <input type="text" id="userInput" placeholder="Type your message..." />
        <button onclick="sendMessage()">Send</button>
    </div>
    <script src="chatbot.js"></script>
    <script>
        function sendMessage() {
            var msg = document.getElementById("userInput").value.trim();
            if (msg === "") return;

            var box = document.getElementById("chatBox");

            box.innerHTML += "<p class='user'>You: " + msg + "</p>";
            document.getElementById("userInput").value = "";

            var reply = getResponse(msg); // call function from chatbot.js
            box.innerHTML += "<p class='bot'>Bot: " + reply + "</p>";

            box.scrollTop = box.scrollHeight;
        }
        document
            .getElementById("userInput")
            .addEventListener("keydown", function (e) {
                if (e.key === "Enter") sendMessage();
            });
    </script>
</body>
</html>
